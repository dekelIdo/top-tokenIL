<mat-toolbar color="primary" class="header-toolbar" fxLayout="row" fxLayoutAlign="space-between center">
  <div class="header-left" (click)="goToCatalog()" style="cursor:pointer;display:flex;align-items:center;">
    <img src="assets/logo-ps5.png" alt="לוגו TopToken" class="logo" height="36" />
    <span class="site-name">TopToken</span>
  </div>
  <div class="header-center">
    <a mat-button routerLink="/catalog" routerLinkActive="active">קטלוג</a>
    <a mat-button routerLink="/cart" routerLinkActive="active">עגלה</a>
  </div>
  <div class="header-right">
    <button mat-icon-button (click)="goToCart()" aria-label="עגלה">
      <mat-icon matBadge="{{cartCount}}" matBadgeColor="accent">shopping_cart</mat-icon>
    </button>
  </div>
</mat-toolbar>
