<mat-card class="token-card">
  <img mat-card-image [src]="token.imageUrl" [alt]="token.name" />
  <mat-card-content>
    <div class="token-info">
      <h3>{{ token.name }}</h3>
      <div class="token-meta">
        <span class="rating">{{ token.rating }}</span>
        <span class="position">{{ token.position }}</span>
        <span class="club">{{ token.club }}</span>
      </div>
      <div class="price">₪{{ token.price }}</div>
    </div>
  </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="add.emit(token)">הוסף לעגלה</button>
  </mat-card-actions>
</mat-card>
