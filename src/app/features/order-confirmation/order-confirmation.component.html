<div class="confirmation-container">
  <mat-card class="confirmation-card">
    <h2>תודה, {{ name }}!</h2>
    <div class="confirmation-message">ההזמנה שלך הושלמה בהצלחה.</div>
    <div class="confirmation-summary">
      <h3>סיכום הזמנה</h3>
      <div *ngFor="let item of items" class="summary-item">
        <span>{{ item.name }}</span>
        <span>₪{{ item.price }}</span>
      </div>
      <div class="summary-total">
        <span>סה"כ:</span>
        <span>₪{{ total }}</span>
      </div>
      <div class="transaction-id">מספר עסקה: <b>{{ transactionId }}</b></div>
    </div>
    <button mat-raised-button color="primary" (click)="backToCatalog()">חזרה לקטלוג</button>
  </mat-card>
</div>
